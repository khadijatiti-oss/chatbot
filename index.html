<!-- ============ BOOSTMARK CHATBOT ============ -->
<style>
  #chat-widget { position: fixed; bottom: 6rem; right: 2rem; z-index: 49; font-family: 'Inter', sans-serif; }
  #chat-bubble {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #a3e635, #65a30d);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 0 20px rgba(163,230,53,0.5);
    transition: transform 0.2s;
    margin-left: auto;
  }
  #chat-bubble:hover { transform: scale(1.1); }
  #chat-box {
    position: absolute; bottom: 65px; right: 0;
    width: 340px; max-height: 500px;
    background: #020b0d;
    border: 1px solid rgba(163,230,53,0.3);
    border-radius: 20px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(163,230,53,0.1);
    opacity: 0; transform: translateY(16px) scale(0.97);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #chat-box.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
  #chat-header {
    background: linear-gradient(135deg, rgba(163,230,53,0.15), rgba(163,230,53,0.05));
    border-bottom: 1px solid rgba(163,230,53,0.2);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  #chat-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #a3e635, #65a30d);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: white; flex-shrink: 0;
  }
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    max-height: 320px;
    scrollbar-width: thin; scrollbar-color: rgba(163,230,53,0.3) transparent;
  }
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-thumb { background: rgba(163,230,53,0.3); border-radius: 2px; }
  .cm { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 0.82rem; line-height: 1.5; }
  .cm.bot { align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; border-bottom-left-radius: 4px; }
  .cm.user { align-self: flex-end; background: linear-gradient(135deg, #a3e635, #65a30d); color: #020b0d; font-weight: 600; border-bottom-right-radius: 4px; }
  .cm.typing { color: #a3e635; font-style: italic; }
  #chat-input-area {
    padding: 12px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px; background: rgba(255,255,255,0.02);
  }
  #chat-input {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: white; padding: 9px 12px; border-radius: 10px;
    font-size: 0.82rem; outline: none; font-family: 'Inter', sans-serif;
  }
  #chat-input:focus { border-color: rgba(163,230,53,0.5); }
  #chat-input::placeholder { color: #475569; }
  #chat-send {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #a3e635, #65a30d);
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s; flex-shrink: 0;
  }
  #chat-send:hover { transform: scale(1.08); }
  #chat-send:disabled { opacity: 0.4; }
  .chat-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chat-quick button {
    font-size: 0.72rem; padding: 5px 10px; border-radius: 20px;
    border: 1px solid rgba(163,230,53,0.3); background: rgba(163,230,53,0.08);
    color: #a3e635; cursor: pointer; transition: background 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .chat-quick button:hover { background: rgba(163,230,53,0.2); }
  @media (max-width: 400px) { #chat-box { width: 90vw; right: -1rem; } }
</style>

<div id="chat-widget">
  <!-- Chat Box -->
  <div id="chat-box">
    <div id="chat-header">
      <div id="chat-avatar">BM</div>
      <div>
        <p style="color:white;font-weight:700;font-size:0.85rem;margin:0">BoostMark Assistant</p>
        <p style="color:#a3e635;font-size:0.7rem;margin:0;display:flex;align-items:center;gap:4px">
          <span style="width:6px;height:6px;background:#a3e635;border-radius:50%;display:inline-block"></span>
          En ligne — répond en quelques secondes
        </p>
      </div>
      <button onclick="toggleChat()" style="margin-left:auto;background:none;border:none;color:#64748b;cursor:pointer;font-size:18px;line-height:1">✕</button>
    </div>
    <div id="chat-messages">
      <div class="cm bot">
        👋 Bonjour ! Je suis l'assistant BoostMark. Je peux répondre à toutes vos questions sur nos services, tarifs et délais.
        <div class="chat-quick">
          <button onclick="quickAsk('Quels sont vos tarifs ?')">💰 Tarifs</button>
          <button onclick="quickAsk('Quel est le délai de livraison ?')">⏱ Délais</button>
          <button onclick="quickAsk('Quels services proposez-vous ?')">🛠 Services</button>
          <button onclick="quickAsk('Comment vous contacter ?')">📞 Contact</button>
        </div>
      </div>
    </div>
    <div id="chat-input-area">
      <input id="chat-input" type="text" placeholder="Posez votre question..." onkeypress="if(event.key==='Enter') sendChat()"/>
      <button id="chat-send" onclick="sendChat()">
        <span class="material-symbols-outlined" style="font-size:18px">send</span>
      </button>
    </div>
  </div>

  <!-- Toggle Bubble -->
  <div id="chat-bubble" onclick="toggleChat()" title="Parler à notre assistant">
    <span class="material-symbols-outlined" id="chat-bubble-icon" style="font-size:24px;color:white">smart_toy</span>
  </div>
</div>

<script>
// ============================================================
// BOOSTMARK CHATBOT
// ============================================================
const BOOSTMARK_SYSTEM = `Tu es l'assistant virtuel de BoostMark, une agence de marketing digital basée à Casablanca, Maroc. Tu réponds uniquement en français, en arabe marocain (darija) ou en anglais selon la langue de l'utilisateur.

Voici tout ce que tu sais sur BoostMark :

SERVICES :
- Design UI/UX : création d'interfaces modernes et converties
- Landing Pages optimisées pour la conversion
- SEO technique et SEA (Google Ads)
- A/B Testing et optimisation de conversion
- Gestion des réseaux sociaux (Instagram, TikTok, LinkedIn)
- Intégration IA et automatisation marketing
- Copywriting en français, arabe et anglais

TARIFS :
- Pack Starter : 790 DHS (1 landing page, design responsive, audit SEO de base)
- Pack Business : 2990 DHS/mois (sites multipages, SEO & SEA inclus, dashboard analytique, support 24/7)
- Pack Elite : 9990 DHS/mois (infrastructure cloud dédiée, IA custom, support VIP dédié, SLA 99.9%)
- Facturation annuelle disponible avec 20% de réduction

DÉLAIS :
- Délai moyen de livraison : 7 jours ouvrables
- Pour les projets Elite, planning personnalisé

CHIFFRES CLÉS :
- 100+ experts freelances marocains
- 95% de taux de rétention client
- +324% de croissance moyenne observée chez les clients
- 2M DHS de chiffre d'affaires

CONTACT :
- WhatsApp : +212 720 909 638 (wa.me/212720909638)
- Instagram : @boostmark_01
- TikTok : @boostmark1
- Site web : khadijatiti-oss.github.io/website-BoostMark
- Consultation gratuite de 30 minutes disponible

ÉQUIPE :
- 100+ spécialistes : designers UI/UX, développeurs web, experts SEO, copywriters, social media managers, stratèges IA

VALEURS :
- Sincérité, Rapidité, Excellence, Communauté
- Spécialisés dans le marché marocain
- Compréhension des défis des freelancers et entrepreneurs marocains

RÈGLES DE RÉPONSE :
- Réponds de façon concise, amicale et professionnelle
- Si l'utilisateur veut démarrer un projet, encourage-le à contacter via WhatsApp : wa.me/212720909638
- Ne réponds qu'aux questions liées à BoostMark et au marketing digital
- Si tu ne sais pas quelque chose, dis-le honnêtement et redirige vers WhatsApp
- Maximum 3-4 phrases par réponse, sauf si plus de détails sont demandés`;

let chatOpen = false;
let chatHistory = [];

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chat-box').classList.toggle('open', chatOpen);
  document.getElementById('chat-bubble-icon').textContent = chatOpen ? 'close' : 'smart_toy';
}

function quickAsk(q) {
  document.getElementById('chat-input').value = q;
  sendChat();
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const text = input.value.trim();
  if (!text) return;

  appendMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;

  // Add to history
  chatHistory.push({ role: 'user', content: text });

  // Typing indicator
  const typingEl = appendMsg('...', 'bot typing');

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer 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',
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href,
        'X-Title': 'BoostMark Assistant'
      },
      body: JSON.stringify({
        model: 'arcee-ai/trinity-large-preview:free',
        messages: [
          { role: 'system', content: BOOSTMARK_SYSTEM },
          ...chatHistory
        ]
      })
    });

    const data = await res.json();
    typingEl.remove();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      chatHistory.push({ role: 'assistant', content: reply });
      appendMsg(reply, 'bot');
    } else {
      appendMsg("Je n'ai pas pu répondre. Contactez-nous sur WhatsApp : wa.me/212720909638", 'bot');
    }
  } catch (e) {
    typingEl.remove();
    appendMsg("Erreur de connexion. Contactez-nous directement sur WhatsApp 📲", 'bot');
  } finally {
    sendBtn.disabled = false;
  }
}

function appendMsg(text, type) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'cm ' + type;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
</script>
